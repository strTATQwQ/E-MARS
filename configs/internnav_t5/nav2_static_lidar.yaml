# T5-only namespaced completion_sim navigation parameters.
#
# This is an immutable T5 copy of the frozen T4 static-map + LiDAR-local
# profile.  Only the Collision Monitor topic parameters that must resolve
# inside /t5/lane_a or /t5/lane_b are relative.  Do not use this file for T4.

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    costmap_update_timeout: 5.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
      movement_time_allowance: 120.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      # Keep T5 Nav2 completion strictly inside the 0.05 m / 3 deg action-gate
      # slack. Frozen T4 and strict profiles use separate parameter files.
      xy_goal_tolerance: 0.03
      yaw_goal_tolerance: 0.03
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: false
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.25
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.25
      min_speed_theta: 0.0
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 15
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 2.5
      xy_goal_tolerance: 0.03
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: [RotateToGoal, Oscillation, BaseObstacle, GoalAlign, PathAlign, PathDist, GoalDist]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 2.5
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      robot_radius: 0.30
      footprint_padding: 0.02
      track_unknown_space: false
      plugins: [voxel_layer, inflation_layer]
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        footprint_clearing_enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.10
        z_voxels: 16
        unknown_threshold: 15
        mark_threshold: 0
        combination_method: 1
        max_obstacle_height: 1.5
        tf_filter_tolerance: 2.5
        observation_sources: lidar
        lidar:
          topic: /go2/lidar/points_base
          data_type: PointCloud2
          clearing: true
          marking: true
          min_obstacle_height: 0.05
          max_obstacle_height: 1.5
          obstacle_min_range: 0.10
          obstacle_max_range: 5.0
          raytrace_min_range: 0.10
          raytrace_max_range: 5.5
          expected_update_rate: 5.0
          observation_persistence: 5.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        cost_scaling_factor: 3.0
        inflation_radius: 0.40
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 2.5
      rolling_window: false
      resolution: 0.05
      robot_radius: 0.30
      footprint_padding: 0.02
      track_unknown_space: true
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        enabled: true
        map_topic: /map
        map_subscribe_transient_local: true
        subscribe_to_updates: false
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        cost_scaling_factor: 3.0
        inflation_radius: 0.40
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 2.0
    costmap_update_timeout: 5.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 2.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.25, 0.0, 1.0]
    min_velocity: [-0.25, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.30

# Jazzy navigation_launch.py always creates the docking lifecycle node.  It is
# not used by InternNav, but it still needs one inert plugin so the shared
# lifecycle manager can activate the navigation stack.  No dock instances are
# configured and battery/stall actuation paths remain disabled.
docking_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 50.0
    base_frame: base_link
    fixed_frame: odom
    dock_plugins: [simple_charging_dock]
    simple_charging_dock:
      plugin: opennav_docking::SimpleChargingDock
      docking_threshold: 0.05
      staging_x_offset: -0.70
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.05
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: local_costmap/costmap_raw
      footprint_topic: local_costmap/published_footprint
      transform_tolerance: 2.5
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3

collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: odom
    # This input is observed, but the output below is deliberately not routed
    # to a controller or robot. It provides WARN-only completion_sim evidence.
    # These three T5-only relative topics resolve inside the Lane namespace.
    cmd_vel_in_topic: cmd_vel_nav
    cmd_vel_out_topic: completion_sim/collision_monitor/warn_only_cmd_vel
    transform_tolerance: 2.5
    source_timeout: 5.0
    base_shift_correction: true
    stop_pub_timeout: 1.0
    polygons: [PolygonStop, FootprintApproach]
    PolygonStop:
      type: polygon
      points: "[[0.38, 0.26], [0.38, -0.26], [-0.26, -0.26], [-0.26, 0.26]]"
      action_type: stop
      min_points: 3
      visualize: true
      polygon_pub_topic: completion_sim_polygon_stop
      enabled: true
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: local_costmap/published_footprint
      time_before_collision: 1.2
      simulation_time_step: 0.05
      min_points: 3
      visualize: true
      enabled: true
    observation_sources: [pointcloud]
    pointcloud:
      type: pointcloud
      topic: /go2/safety/points
      min_height: 0.05
      max_height: 1.5
      enabled: true

internvla_go2_controller_bridge:
  ros__parameters:
    use_sim_time: true
    # Command freshness remains strict even though sensor/costmap freshness is
    # the completion_sim 5 s policy. This output must still pass the sim e-stop.
    command_timeout_sec: 0.30
    expected_control_hz: 50.0
