frontend:
  host: 0.0.0.0
  port: 8300
  poll_interval_s: 0.25
  paths:
    snapshot_sidecar_path: ${T5_LANE_B_RESULTS}/step3/snapshots.jsonl
    decision_log_path: ${T5_LANE_B_RESULTS}/step3/frontend_decisions.jsonl
    health_path: ${T5_LANE_B_RESULTS}/step3/health.json
    gpu_telemetry_path: ${T5_LANE_B_RESULTS}/step3/gpu.json
    camera_dir: ${T5_LANE_B_RESULTS}/step3/cameras
  ros_adapter:
    enabled: true
    node_name: vla_nav_panel_ros_adapter
    preview_hz: 1.0
    state_publish_hz: 2.0
    stale_after_s: 7.0
    jpeg_quality: 80
    go2_h264_decoder: ffmpeg
    go2_camera_source: videohub_rpc
    usb_cameras:
      enabled: true
      capture_hz: 5.0
      width: 640
      height: 480
      input_format: mjpeg
      horizontal_flip: true
      views:
        front_left: /dev/v4l/by-path/platform-NVDA8000:01-usb-0:1.2:1.0-video-index0
        front: /dev/v4l/by-path/platform-NVDA8000:01-usb-0:1.3:1.0-video-index0
        front_right: /dev/v4l/by-path/platform-NVDA8000:01-usb-0:1.4:1.0-video-index0
        rear: /dev/v4l/by-path/platform-NVDA8000:01-usb-0:1.1:1.0-video-index0
    paths:
      state_path: ${T5_LANE_B_RESULTS}/ros/ros_state.json
      camera_manifest_path: ${T5_LANE_B_RESULTS}/ros/ros_cameras.json
      camera_dir: ${T5_LANE_B_RESULTS}/ros/cameras
    topics:
      go2_front: /frontvideostream
      low_state: /lowstate
      sport_mode_state: /sportmodestate
      lidar_state: /utlidar/lidar_state
      lidar_imu: /utlidar/imu
      lidar_cloud: /utlidar/cloud
      odometry: /utlidar/robot_odom
      d435_color: /check/d435/color/image_raw
      d435_depth: /check/d435/depth/image_rect_raw
  api:
    - GET /api/v1/health
    - GET /api/v1/state
    - GET /api/v1/cameras/{view_id}.jpg
    - WS /api/v1/stream
  forbidden_http_methods:
    - POST
    - PUT
    - PATCH
    - DELETE

contract:
  schema_version: 1
  lane_id: b
  rev_c_view_order:
    - front_left
    - front
    - front_right
    - rear
  snapshot_id: b::<episode>::<reset>::<sequence>
  motion_authority: none
  mission_editor: browser_local_draft_only
