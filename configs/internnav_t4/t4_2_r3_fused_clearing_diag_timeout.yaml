# Isaac diagnostic only: 2.50 s exceeds the measured 2.211 s max frame gap.
# Real Go2 must use the 0.35 s default or a measured hardware bound.
# Generated by scripts/build_t4_2_r3_configs.py.
# geometry_sources: d435i=true, lidar=true
# pose_verified_footprint_clearing: true
# Safety invariants: robot_radius=0.30, padding=0.02, inflation=0.40.
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
      movement_time_allowance: 120.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.30
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.25
      lookahead_dist: 0.50
      min_lookahead_dist: 0.30
      max_lookahead_dist: 0.80
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.8
      transform_tolerance: 0.5
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.60
      # Collision Monitor is the final stop layer in this obstacle-qualified
      # profile; RPP still consumes inflated costs and replans around obstacles.
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.90
      regulated_linear_scaling_min_speed: 0.05
      cost_scaling_dist: 0.40
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.40
      max_angular_accel: 3.2
      allow_reversing: false

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      robot_radius: 0.30
      footprint_padding: 0.02
      track_unknown_space: true
      plugins: [nvblox_layer, footprint_clearing_layer, inflation_layer]
      nvblox_layer:
        plugin: nvblox::nav2::NvbloxCostmapLayer
        enabled: true
        nav2_costmap_global_frame: odom
        nvblox_map_slice_topic: /nvblox_node/static_map_slice
        convert_to_binary_costmap: true
      footprint_clearing_layer:
        plugin: nav2_footprint_clearing_layer::FootprintClearingLayer
        enabled: true
        require_depth: true
        require_lidar: true
        footprint_radius_m: 0.32
        startup_edge_m: 0.0
        obstacle_min_height_m: 0.05
        obstacle_max_height_m: 1.5
        data_timeout_sec: 2.50
        tf_timeout_sec: 0.20
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.40
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.05
      robot_radius: 0.30
      footprint_padding: 0.02
      track_unknown_space: true
      plugins: [nvblox_layer, footprint_clearing_layer, inflation_layer]
      nvblox_layer:
        plugin: nvblox::nav2::NvbloxCostmapLayer
        enabled: true
        nav2_costmap_global_frame: map
        nvblox_map_slice_topic: /nvblox_node/static_map_slice
        convert_to_binary_costmap: true
      footprint_clearing_layer:
        plugin: nav2_footprint_clearing_layer::FootprintClearingLayer
        enabled: true
        require_depth: true
        require_lidar: true
        footprint_radius_m: 0.32
        startup_edge_m: 0.0
        obstacle_min_height_m: 0.05
        obstacle_max_height_m: 1.5
        data_timeout_sec: 2.50
        tf_timeout_sec: 0.20
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.40
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.25, 0.0, 1.0]
    min_velocity: [-0.25, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_nav
    cmd_vel_out_topic: cmd_vel_safe
    transform_tolerance: 0.2
    source_timeout: 1.50
    base_shift_correction: true
    stop_pub_timeout: 1.0
    polygons: [PolygonStop, FootprintApproach]
    PolygonStop:
      type: polygon
      # Same audited physical stop envelope as the continuous Oracle path.
      points: "[[0.38, 0.26], [0.38, -0.26], [-0.26, -0.26], [-0.26, 0.26]]"
      action_type: stop
      min_points: 3
      visualize: true
      polygon_pub_topic: polygon_stop
      enabled: true
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 1.2
      simulation_time_step: 0.05
      min_points: 3
      visualize: true
      enabled: true
    observation_sources: [pointcloud]
    pointcloud:
      type: pointcloud
      topic: /go2/safety/points
      min_height: 0.05
      max_height: 1.5
      enabled: true

internvla_go2_controller_bridge:
  ros__parameters:
    use_sim_time: false
    command_timeout_sec: 0.30
    expected_control_hz: 50.0
