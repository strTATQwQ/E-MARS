/**:
  ros__parameters:
    # NVIDIA Isaac ROS Nvblox release-4.5 values, specialized only for the
    # calibrated Go2 depth stream. TF is ground truth only in T4.2.
    cuda_stream_type: 1
    voxel_size: 0.05
    num_cameras: 1
    use_tf_transforms: true
    global_frame: map
    mapping_type: static_tsdf
    tick_period_ms: 10
    integrate_depth_rate_hz: 10.0
    integrate_color_rate_hz: 0.0
    integrate_lidar_rate_hz: 10.0
    update_mesh_rate_hz: 2.0
    update_esdf_rate_hz: 10.0
    publish_layer_rate_hz: 5.0
    publish_debug_vis_rate_hz: 1.0
    clear_map_outside_radius_rate_hz: 1.0
    print_rates_to_console: false
    print_timings_to_console: false
    print_delays_to_console: false
    print_queue_drops_to_console: true
    print_statistics_on_console_period_ms: 10000
    esdf_mode: "2d"
    publish_esdf_distance_slice: true
    use_color: false
    use_depth: true
    use_lidar: true
    lidar_width: 180
    lidar_height: 8
    lidar_min_valid_range_m: 0.10
    use_non_equal_vertical_fov_lidar_params: true
    min_angle_below_zero_elevation_rad: 0.2617993878
    max_angle_above_zero_elevation_rad: 0.3490658504
    use_lidar_motion_compensation: false
    pointcloud2_timestamps_are_relative: false
    maximum_input_queue_length: 10
    map_clearing_radius_m: 15.0
    map_clearing_frame_id: base_link
    input_qos: SENSOR_DATA
    esdf_slice_bounds_visualization_attachment_frame_id: base_link
    esdf_slice_bounds_visualization_side_length: 12.0
    workspace_height_bounds_visualization_attachment_frame_id: base_link
    workspace_height_bounds_visualization_side_length: 12.0
    layer_visualization_min_tsdf_weight: 0.1
    layer_visualization_exclusion_height_m: 2.0
    layer_visualization_exclusion_radius_m: 15.0
    max_back_projection_distance: 7.0
    back_projection_subsampling: 1
    layer_streamer_bandwidth_limit_mbps: -1.0
    multi_mapper:
      connected_mask_component_size_threshold: 2000
      remove_small_connected_components: true
    static_mapper:
      do_depth_preprocessing: false
      depth_preprocessing_num_dilations: 3
      projective_integrator_max_integration_distance_m: 5.0
      projective_integrator_truncation_distance_vox: 4.0
      projective_integrator_weighting_mode: inverse_square_tsdf_distance_penalty
      projective_integrator_max_weight: 5.0
      projective_tsdf_integrator_invalid_depth_decay_factor: -1.0
      raycast_subsampling_factor: 1
      workspace_bounds_type: height_bounds
      workspace_bounds_min_height_m: -0.10
      workspace_bounds_max_height_m: 2.00
      esdf_integrator_min_weight: 0.1
      esdf_integrator_max_site_distance_vox: 2.0
      esdf_integrator_max_distance_m: 2.0
      unobserved_esdf_policy: ignore
      # The MP3D floor mesh reaches into the 0.09 m Isaac-Sim band and made
      # every observed 2D ESDF column lethal. Slice above that band while
      # retaining the Go2 body/door/obstacle collision envelope.
      esdf_slice_height: 0.15
      esdf_slice_min_height: 0.15
      esdf_slice_max_height: 0.65
      mesh_integrator_min_weight: 0.1
      mesh_integrator_weld_vertices: true
      layer_streamer_exclusion_height_m: 2.0
      layer_streamer_exclusion_radius_m: 15.0
