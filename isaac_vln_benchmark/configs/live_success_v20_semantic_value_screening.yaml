benchmark:
  name: live_success_v20_semantic_value_screening
  timeout_sec_default: 150
  seeds: [0]
  preserve_task_ids: true
  preserve_task_seeds: true
  modes:
    - omninav_only_v20_semantic_screen
    - omninav_public_heuristic_v20_semantic_screen
    - omninav_forced_semantic_oracle_v20_semantic_screen
    - omninav_step_semantic_executive_v20_semantic_screen
  tasks_source: configs/generated/v20_semantic_value_screen_tasks.yaml

tasks:
  semantic_navigation:
    ids: [ref_01, ref_02, ref_03, ref_04, ref_05, comp_01, comp_02, comp_03, comp_04, comp_05, rec_01, rec_02, rec_03, rec_04, rec_05]
    count: 15
    timeout_sec: 150

runtime:
  scenes_source: configs/generated/natural_language_navigation_v19_scenes.yaml
  runtime_profile: v19_local_marker_v2
  instrumented_semantic_markers: true
  geometry_judge_is_oracle_only: true

camera_contract:
  omninav_prefer_synthetic_primary: false
  step_image_topic: /camera/front/isaac_image
  fresh_image_max_age_sec: 0.75

gates:
  forced_oracle_success_min: 12
  step_success_min: 8
  step_clean_min: 6
  success_delta_min: 2
  clean_delta_min: 2
  helped_gt_hurt: true
  step_latency_p95_max_sec: 7.0
  collision: 0
  runtime_stale: 0
  timebase_error: 0
  stale_action_executed: 0

scope:
  evidence_scope: instrumented_explicit_stage_semantic_value_screen
  full_natural_language_value_claim: unproven
  qualification_evidence: false
  local_navigation_owner: OmniNav
  semantic_executive_owner: Step
  real_go2_connected: false
