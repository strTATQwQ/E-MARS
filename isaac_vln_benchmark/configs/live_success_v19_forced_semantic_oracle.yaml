benchmark:
  name: live_success_v19_forced_semantic_oracle
  timeout_sec_default: 120
  seeds: [0]
  preserve_task_ids: true
  preserve_task_seeds: true
  modes: [forced_semantic_oracle]
  tasks_source: configs/generated/natural_language_navigation_v19_tasks.yaml

tasks:
  semantic_navigation:
    count: 30
    timeout_sec: 120

runtime:
  scenes_source: configs/generated/natural_language_navigation_v19_scenes.yaml
  runtime_profile: v19_local_marker_v2
  instrumented_semantic_markers: true
  geometry_judge_is_oracle_only: true

evidence_policy:
  require_real_omninav: true
  require_forced_semantic_oracle: true
  require_normal_execution_chain: true
  allow_mock_or_fallback: false
  qualification_evidence: false
  locomotion_fidelity: ideal_kinematic

gates:
  total_success_min: 24
  category_success_min: 8
  collision: 0
  runtime_stale: 0
  timebase_error: 0
  stale_action_executed: 0

scope:
  step_model_enabled: false
  local_navigation_owner: OmniNav
  train_or_modify_locomotion: false
  reinforcement_learning: false
  real_go2_connected: false
  qualification_evidence: false
  internnav_identity: CmaAgent/system1/fallback_static_cma_tokens
