benchmark:
  name: v11_route_handoff_smoke
  timeout_sec_default: 120
  seeds: [0]
  modes:
    - omninav_forced_route_stop_oracle_v11

tasks:
  turn_choice:
    count: 2
    timeout_sec: 120

targets:
  decision_published_min: 2
  rotate_phase_entered_min: 2
  entered_correct_branch_min: 2
  collision_count: 0
  runtime_stale_discards: 0
  timebase_error_count: 0
  stale_action_executed: 0

gate_policy:
  step: FROZEN
  real_robot: DISABLED
