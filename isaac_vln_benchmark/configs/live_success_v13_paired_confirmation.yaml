benchmark:
  name: live_success_v13_paired_confirmation
  timeout_sec_default: 135
  seeds: [0, 1, 2, 3, 4, 5, 6, 7, 8]
  modes:
    - omninav_only_v11_matched
    - omninav_step_route_stop_v12_screen
  randomize_mode_order_by_task: true
  mode_order_seed: 20260711

tasks:
  simple_navigation:
    count: 2
    timeout_sec: 135
  turn_choice:
    count: 2
    timeout_sec: 120
  semantic_target:
    count: 1
    timeout_sec: 120

targets:
  pairs: 45
  paired_success_bootstrap_ci95_lower_gt: 0.0
  clean_delta_min: 0
  route_subset_delta_min: 0
  semantic_subset_delta_min: 0
  runtime_stale_discards: 0
  timebase_error_count: 0
  collision_count: 0
  stale_action_executed: 0

policy:
  screen_gate_required: true
  mode_order_randomized_within_pair: true
  config_changes_during_run: forbidden
  real_step_required: true
  real_robot: disabled

camera_contract:
  omninav_prefer_synthetic_primary: true
  step_image_topic: /camera/front/isaac_image
